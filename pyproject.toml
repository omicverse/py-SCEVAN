[project]
name = "pyscevan"
version = "0.1.0.dev0"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-2.0-or-later"
dependencies = ["numpy>=1.24","scipy>=1.10","pandas>=2.0","scikit-learn>=1.3",
                "numba>=0.59","anndata>=0.10","typer>=0.12"]
[project.scripts]
pyscevan = "pyscevan.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["pyscevan"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=9.0.3",
    "twine>=6.2.0",
]
